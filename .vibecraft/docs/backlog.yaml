  - id: task-5138
    title: Заявка на выступление и контакты
    description:
      Контактные данные (телефоны, мессенджеры, соцсети) и форма заявки
      на выступление. Форма проверяет введённые данные и показывает
      подтверждение отправки. Пользователь может связаться удобным способом.
    status: completed
    acceptance_criteria:
      - Контакты группы отображаются на странице
      - Форма заявки валидирует данные и показывает подтверждение отправки
      - Пользователь может связаться удобным способом (звонок/мессенджер/соцсети)
    summary:
      Реализован раздел «Заявка и контакты» (#contacts) на главной странице.
      Отображаются контакты группы (телефоны со ссылками tel:, мессенджеры
      WhatsApp/Telegram и соцсети Instagram/ВКонтакте), по которым можно
      связаться кликом. Форма заявки валидирует имя, телефон и описание с
      помощью zod, показывает ошибки полей, сообщение в тосте и подтверждение
      отправки с возможностью отправить новую заявку. Данные — в lib/data.ts
      (contactPhones/contactMessengers/contactSocials), интерактив — в
      components/contact-section.tsx, подключённом в app/page.tsx. typecheck,
      lint и build проходят.
