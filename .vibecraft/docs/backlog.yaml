version: 1
tasks:
  - id: task-0071
    title: Визуальная заглушка главной страницы
    description: >-
      Создать главную страницу сайта со статическими данными-заглушками.

      Цель: дать пользователю первый визуальный результат как можно быстрее.

      Тёмный концертный стиль с неоновыми акцентами и крупной типографикой.
      Реализовать только то, что пользователь увидит сразу при открытии
      приложения — заголовок, девиз, базовую навигацию. Остальные разделы
      реализовывать не нужно.
    status: completed
    acceptance_criteria:
      - Главная страница отображается без ошибок
      - Тёмная концертная стилистика с неоновыми акцентами и крупной типографикой
      - Название группы «СПЕЦИИ» и девиз отображаются на главном экране
    summary: Реализована главная страница сайта кавер-группы «СПЕЦИИ» в тёмной
      концертной стилистике с неоновыми акцентами и крупной типографикой. На
      главном экране отображаются название группы, девиз «Зажигаем праздник
      живым звуком», базовые CTA и навигация в шапке. Основная реализация — в
      app/page.tsx, тёмная тема и неон — в app/layout.tsx и app/globals.css.
  - id: task-1095
    title: Раздел «О группе»
    description:
      "Блок о коллективе: история, стиль исполнения, типы событий, для
      которых подходит группа (свадьбы, корпоративы, вечеринки), и преимущества
      (живой звук, опыт, программы под мероприятие). Представлено читаемо с
      помощью карточек и иконок."
    status: completed
    acceptance_criteria:
      - Раздел «О группе» рассказывает о коллективе, стиле и подходящих событиях
      - Преимущества группы представлены читаемо (иконки или краткие карточки)
      - Информация отображается из статических данных
    summary:
      "Раздел «О группе» добавлен на главную страницу (app/page.tsx, секция
      #about): карточки истории и стиля коллектива, типы событий (свадьбы,
      корпоративы, вечеринки) и преимущества (живой звук, опыт, программы под
      мероприятие) с иконками lucide. Данные вынесены в lib/data.ts и
      отображаются из статических данных. typecheck, lint и build проходят."
  - id: task-6192
    title: Репертуар с фильтром и поиском
    description:
      Список репертуара, сгруппированный по настроению/стилю (например,
      хиты разных эпох, современные, танцевальные). Пользователь может
      отфильтровать песни по категории или найти нужную через поиск.
    status: completed
    acceptance_criteria:
      - Репертуар отображается списком по категориям
      - Пользователь может отфильтровать песни по категории
      - Пользователь может найти песню через поиск
    summary:
      Реализован раздел «Репертуар» на главной странице. Песни сгруппированы
      по категориям (хиты разных эпох, современные, танцевальные), пользователь
      может отфильтровать список по категории кнопками и найти песню через поиск
      по названию или исполнителю; при отсутствии совпадений показывается пустое
      состояние. Данные вынесены в lib/data.ts (repertoireCategories,
      repertoireSongs), интерактив — в клиентском компоненте
      components/repertoire-section.tsx, подключённом в app/page.tsx. typecheck,
      lint и build проходят.
